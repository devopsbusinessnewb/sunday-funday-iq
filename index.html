<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunday Funday IQ">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Sunday Funday IQ · Command Center</title>
<style>
:root{--bg:#07111f;--panel:#0f1d31;--panel2:#132641;--line:#243954;--text:#edf5ff;--muted:#91a7c2;--green:#32d296;--yellow:#f3c969;--red:#ff6b7a;--accent:#8ee3cf;--blue:#5ab0ff;--purple:#a78bfa}
*{box-sizing:border-box}html,body{min-height:100%;background:var(--bg)}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{width:min(100%,900px);min-height:100vh;min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;background:linear-gradient(180deg,#07111f,#091729 48%,#07111f)}.header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.eyebrow{font-size:9px;letter-spacing:.15em;color:var(--accent);font-weight:900}h1{font-size:24px;line-height:1;margin:4px 0 0}.refresh{border:0;border-radius:10px;background:var(--accent);color:#06201a;padding:8px 10px;font-weight:900;white-space:nowrap;cursor:pointer}.overview{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:10px;margin:7px 1px 9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{appearance:none;position:relative;display:flex;flex-direction:column;min-width:0;min-height:122px;background:rgba(15,29,49,.98);border:1px solid var(--line);border-radius:15px;padding:10px;text-align:left;color:var(--text);font:inherit;overflow:hidden;cursor:pointer}.tile:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--module,var(--accent))}.tile.espn{--module:#f05a43}.tile.guillotine{--module:#8ee3cf}.tile.pickem{--module:#5ab0ff}.tile.yahoo{--module:#a78bfa}.tile.selected{background:var(--panel2);border-color:var(--module)}.tilehead{display:flex;justify-content:space-between;gap:5px;align-items:center}.module{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:7px;font-weight:850;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.dot.pending{background:var(--yellow)}.dot.error{background:var(--red)}.main{font-size:20px;font-weight:900;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.context{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tilebottom{display:flex;justify-content:space-between;gap:5px;align-items:flex-end;margin-top:auto;padding-top:7px}.key{font-size:10px;color:var(--accent);font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.key.warn{color:var(--yellow)}.trendmini{display:flex;align-items:center;gap:3px;font-size:8px;color:var(--muted);white-space:nowrap}.trendmini.good{color:var(--green)}.trendmini.down{color:var(--yellow)}.loading{font-size:9px;color:var(--muted);padding-top:22px}.detailpanel{flex:1;min-height:196px;margin-top:9px;background:rgba(15,29,49,.96);border:1px solid var(--line);border-radius:17px;padding:13px;display:flex;flex-direction:column}.detailhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.detailmodule{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.06em}.open{display:inline-block;padding:8px 10px;border-radius:10px;background:var(--accent);color:#06201a;font-size:10px;font-weight:900;text-decoration:none}.headline{font-size:20px;font-weight:900;margin-top:12px}.why{font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.metric{background:#0a1728;border-radius:10px;padding:9px;min-width:0}.metric b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}.trendline{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(36,57,84,.75)}.trendicon{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#173d35;color:#9ff0d0;font-size:14px;font-weight:900;flex:0 0 auto}.trendicon.hold{background:#203858;color:#cfe6ff}.trendicon.down{background:#443a19;color:#ffe79b}.trendicon.wait{background:#203858;color:var(--muted)}.trendlabel{font-size:11px;font-weight:900}.trenddetail{font-size:9px;color:var(--muted);margin-top:1px}.detailfoot{display:flex;justify-content:space-between;gap:10px;color:#69829e;font-size:8px;margin-top:auto;padding-top:10px}
@media(min-width:650px){.tile{min-height:145px}.detailpanel{min-height:225px}.main{font-size:24px}}
@media(max-width:360px){.app{padding-left:9px;padding-right:9px}.grid{gap:6px}.tile{padding:9px;min-height:118px}.main{font-size:18px}.detailpanel{padding:11px}.headline{font-size:18px}}
</style>
</head>
<body>
<main class="app">
  <header class="header"><div><div class="eyebrow">SUNDAY FUNDAY IQ</div><h1>Game Day</h1></div><button class="refresh" id="refresh">↻ Refresh</button></header>
  <div class="overview"><strong id="overview">Loading your teams…</strong><span id="updated">Checking sources</span></div>
  <section class="grid" aria-label="Sunday Funday IQ modules">
    <button class="tile espn selected" id="espnCard" data-module="espn" type="button"><div class="tilehead"><span class="module">🏈 ESPN</span><span class="status"><span class="dot"></span>LOADING</span></div><div class="loading">Loading matchup…</div></button>
    <button class="tile guillotine" id="guillotineCard" data-module="guillotine" type="button"><div class="tilehead"><span class="module">🪓 Guillotine</span><span class="status"><span class="dot"></span>LOADING</span></div><div class="loading">Loading chop board…</div></button>
    <button class="tile pickem" id="pickemCard" data-module="pickem" type="button"><div class="tilehead"><span class="module">🎯 CBS Pick’em</span><span class="status"><span class="dot"></span>LOADING</span></div><div class="loading">Loading weekly card…</div></button>
    <button class="tile yahoo" id="yahooCard" data-module="yahoo" type="button"><div class="tilehead"><span class="module">🏆 Yahoo</span><span class="status"><span class="dot pending"></span>PENDING</span></div><div class="main">Coming next</div><div class="context">Official Yahoo API</div><div class="tilebottom"><span class="key warn">Connection setup</span><span class="trendmini">— Waiting</span></div></button>
  </section>
  <section class="detailpanel" id="detailPanel" aria-live="polite"><div class="loading">Loading selected module…</div></section>
</main>
<script>
const $=id=>document.getElementById(id),LEAGUE_ID='1383615005433274368',SLEEPER='https://api.sleeper.app/v1',TREND_KEY='sfiqHubTrendV1',SELECT_KEY='sfiqHubSelectedV1';let loaded=0,failed=0,latest=0,selected=localStorage.getItem(SELECT_KEY)||'espn';const summaries={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number.isFinite(+n)?(+n).toFixed(1):'—';
const ago=iso=>{const t=typeof iso==='number'?iso:Date.parse(iso||'');if(!Number.isFinite(t))return'Freshness unavailable';latest=Math.max(latest,t);const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<2?'just now':m<60?`${m}m ago`:`${Math.floor(m/60)}h ago`};
function history(){try{return JSON.parse(localStorage.getItem(TREND_KEY)||'{}')}catch{return{}}}
function trend(module,value,period,updateId,higherBetter=true,unit=''){const all=history(),old=all[module],next={value:Number(value),period:String(period),id:String(updateId)};if(!old||old.current?.period!==next.period)all[module]={current:next,previous:null};else if(old.current?.id!==next.id)all[module]={current:next,previous:old.current};localStorage.setItem(TREND_KEY,JSON.stringify(all));const prev=all[module].previous;if(!prev||!Number.isFinite(prev.value)||!Number.isFinite(next.value))return{arrow:'—',cls:'hold',label:'Baseline set',detail:'Trend begins with the next data change'};const delta=next.value-prev.value,good=higherBetter?delta>0:delta<0;if(Math.abs(delta)<.05)return{arrow:'→',cls:'hold',label:'Holding',detail:'No meaningful change since the prior update'};const amount=Math.abs(delta),detail=module==='pickem'?`${good?'Up':'Down'} ${Math.round(amount)} place${Math.round(amount)===1?'':'s'} since the prior update`:`${unit} moved ${delta>0?'+':''}${delta.toFixed(1)} since the prior update`;return{arrow:good?'↗':'↘',cls:good?'':'down',label:good?'Improving':'Slipping',detail}}
function status(label,kind=''){return`<span class="status"><span class="dot ${kind}"></span>${label}</span>`}
function trendMini(t){return`<span class="trendmini ${t.cls==='down'?'down':t.cls===''?'good':''}">${t.arrow} ${t.label}</span>`}
function tile(module,main,context,key,detail,tr,state='LIVE',warn=false){$(`${module}Card`).innerHTML=`<div class="tilehead"><span class="module">${module==='espn'?'🏈 ESPN':module==='guillotine'?'🪓 Guillotine':'🎯 CBS Pick’em'}</span>${status(state)}</div><div class="main">${esc(main)}</div><div class="context">${esc(context)}</div><div class="tilebottom"><span class="key ${warn?'warn':''}">${esc(key)}</span>${trendMini(tr)}</div>`}
function setSummary(module,s){summaries[module]=s;if(selected===module)renderDetail()}
function selectModule(module){selected=module;localStorage.setItem(SELECT_KEY,module);document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('selected',x.dataset.module===module));renderDetail()}
function renderDetail(){const s=summaries[selected]||summaries.espn;if(!s){$('detailPanel').innerHTML='<div class="loading">Loading selected module…</div>';return}$('detailPanel').innerHTML=`<div class="detailhead"><span class="detailmodule">${esc(s.label)}</span>${s.href?`<a class="open" href="${s.href}">Open module →</a>`:''}</div><div class="headline">${esc(s.headline)}</div><div class="why">${esc(s.why)}</div><div class="metrics">${s.metrics.map(x=>`<div class="metric"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div><div class="trendline"><span class="trendicon ${s.trend.cls}">${s.trend.arrow}</span><div><div class="trendlabel">${s.trend.label}</div><div class="trenddetail">${s.trend.detail}</div></div></div><div class="detailfoot"><span>${esc(s.fresh||'')}</span><span>Hub Build 1.2</span></div>`}
function finish(ok=true){ok?loaded++:failed++;$('overview').textContent=failed?`${loaded} live · ${failed} needs attention`:`${loaded} modules live`;$('updated').textContent=latest?`Latest ${ago(latest)}`:'Sources checked'}
async function json(url){const r=await fetch(url+(url.includes('?')?'&':'?')+'v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));return r.json()}
async function loadEspn(){try{const d=await json('./data/live/espn.json'),t=d.team||{},o=d.opponent||{},margin=(+t.projection||0)-(+o.projection||0),remaining=(d.lineup||[]).filter(p=>!p.played).length,live=(+t.score||0)>0||(+o.score||0)>0,tr=trend('espn',margin,d.meta?.week,d.meta?.updatedAt,true,'Projected margin'),score=`${fmt(t.score)}–${fmt(o.score)}`;ago(d.meta?.updatedAt);tile('espn',score,`vs ${o.name||'Opponent'}`,`${margin>=0?'+':''}${fmt(margin)} projected`,`${remaining} left`,tr,live?'LIVE':'READY');setSummary('espn',{label:'🏈 ESPN Fantasy',href:'./apps/espn/',headline:margin>=0?`Projected favorite by ${fmt(margin)}`:`Projected underdog by ${fmt(Math.abs(margin))}`,why:`${t.name||'Sunday Funday'} is ${score} against ${o.name||'Opponent'} with ${remaining} starters remaining.`,metrics:[[fmt(t.score),'Your score'],[fmt(o.score),'Opponent'],[String(remaining),'Starters left']],trend:tr,fresh:`ESPN updated ${ago(d.meta?.updatedAt)}`});finish()}catch{errorTile('espn','ESPN snapshot unavailable.');finish(false)}}
async function loadGuillotine(){try{const [league,users,rosters,nfl]=await Promise.all([json(`${SLEEPER}/league/${LEAGUE_ID}`),json(`${SLEEPER}/league/${LEAGUE_ID}/users`),json(`${SLEEPER}/league/${LEAGUE_ID}/rosters`),json(`${SLEEPER}/state/nfl`)]),week=Number(league.settings?.leg||nfl.week||1),matchups=await json(`${SLEEPER}/league/${LEAGUE_ID}/matchups/${week}`),user=users.find(u=>String(u.display_name||'').toLowerCase()==='sunday_funday')||users.find(u=>String(u.metadata?.team_name||'').toLowerCase().includes('sunday')),saved=JSON.parse(localStorage.getItem('gwPrefs')||'{}'),mine=rosters.find(r=>String(r.owner_id)===String(user?.user_id))||rosters.find(r=>String(r.roster_id)===String(saved.rosterId));if(!mine)throw new Error('team');const rows=rosters.map(r=>{const m=matchups.find(x=>x.roster_id===r.roster_id)||{};return{r,m,pts:+(m.points||0)}}).sort((a,b)=>b.pts-a.pts),me=rows.find(x=>x.r.roster_id===mine.roster_id),rank=rows.indexOf(me)+1,chop=rows[rows.length-1],cushion=me.pts-chop.pts,pmap=me.m.players_points||{},remaining=(me.m.starters||mine.starters||[]).filter(id=>!Object.prototype.hasOwnProperty.call(pmap,id)||Number(pmap[id]||0)===0).length,started=rows.some(x=>x.pts!==0),id=[week,me.pts,chop.pts,rank,remaining].join(':'),tr=trend('guillotine',cushion,week,id,true,'Chop cushion');tile('guillotine',`${fmt(me.pts)} pts`,`${ordinal(rank)} of ${rows.length} · ${user?.display_name||'Sunday_Funday'}`,`${cushion>=0?'+':''}${fmt(cushion)} above chop`,`${remaining} left`,tr,started?'LIVE':'READY');setSummary('guillotine',{label:'🪓 Sleeper Guillotine',href:'./apps/guillotine/',headline:cushion>=12?`${fmt(cushion)} points clear of the chop`:cushion>=5?'Cushion needs watching':'Chop margin is tight',why:`${user?.display_name||'Sunday_Funday'} currently ranks ${ordinal(rank)} of ${rows.length} with ${remaining} starters remaining.`,metrics:[[fmt(me.pts),'Your score'],[`${rank}/${rows.length}`,'Current rank'],[String(remaining),'Starters left']],trend:tr,fresh:`Sleeper live · Week ${week}`});finish()}catch{errorTile('guillotine','Sleeper data unavailable.');finish(false)}}
async function loadPickem(){try{const d=await json('./data/live/cbs-pickem.json'),snaps=[...(d.snapshots||[])].sort((a,b)=>Date.parse(b.ts)-Date.parse(a.ts)),picks=snaps.find(s=>/\| Picks$/.test(s.title||'')),stand=snaps.find(s=>/Weekly Standings/.test(s.title||''));if(!picks||!stand)throw new Error('snapshots');const ptext=picks.text||'',stext=stand.text||'',week=+(ptext.match(/Week\s+(\d+)/i)||[])[1]||1,total=+(ptext.match(/(\d+)\/(\d+) Picks/i)||[])[2]||16,flat=stext.replace(/\s+/g,' ').trim(),mine=flat.match(/(\d+)(?:st|nd|rd|th) Tony Eickhoff\s+(\d+)\s+(\d+)/i),rank=mine?+mine[1]:null,points=mine?+mine[2]:null,finals=(stext.split(/\n\s*1st\s*\n/i)[0].match(/FINAL/g)||[]).length,row=stext.slice(stext.lastIndexOf('Tony Eickhoff'),stext.lastIndexOf('Tony Eickhoff')+900),weights=[...row.matchAll(/\((\d+)\)/g)].map(m=>+m[1]).slice(0,total),left=Math.max(0,total*(total+1)/2-weights.slice(0,finals).reduce((a,b)=>a+b,0)),stamp=Math.max(Date.parse(picks.ts),Date.parse(stand.ts)),tr=trend('pickem',rank,week,stamp,false,'Rank'),games=total-finals;ago(stamp);tile('pickem',`${points??'—'} pts`,`${rank?ordinal(rank):'—'} place · Week ${week}`,`${left} points up`,`${games} games`,tr,finals>=total?'FINAL':finals?'LIVE':'READY',true);setSummary('pickem',{label:'🎯 CBS Pick’em',href:'./apps/pickem/',headline:`${left} confidence points still in play`,why:`You are currently ${rank?ordinal(rank):'unranked'} with ${points??'—'} points and ${games} games remaining. The weekly objective remains a Top 2 finish.`,metrics:[[String(points??'—'),'Weekly points'],[rank?ordinal(rank):'—','Current place'],[String(games),'Games left']],trend:tr,fresh:`CBS updated ${ago(stamp)} · Week ${week}`});finish()}catch{errorTile('pickem','CBS data unavailable.');finish(false)}}
function errorTile(module,message){const card=$(`${module}Card`);card.innerHTML=`<div class="tilehead"><span class="module">${module==='espn'?'🏈 ESPN':module==='guillotine'?'🪓 Guillotine':'🎯 CBS Pick’em'}</span>${status('ERROR','error')}</div><div class="loading">${esc(message)}</div>`;setSummary(module,{label:module,href:`./apps/${module==='pickem'?'pickem':module}/`,headline:'Live data needs attention',why:message,metrics:[['—','Score'],['—','Status'],['—','Trend']],trend:{arrow:'—',cls:'down',label:'Unavailable',detail:'Open the module for details'},fresh:''})}
function ordinal(n){const v=n%100;return n+(v>=11&&v<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th')}
summaries.yahoo={label:'🏆 Yahoo Fantasy',href:'',headline:'Official API connection is next',why:'Yahoo will join the live command center after the approved API access is provisioned. No manual workaround is being introduced.',metrics:[['Pending','Status'],['Official','Data path'],['—','Trend']],trend:{arrow:'—',cls:'wait',label:'Waiting',detail:'No performance trend available yet'},fresh:'Yahoo API provisioning'};
document.querySelectorAll('.tile').forEach(x=>x.addEventListener('click',()=>selectModule(x.dataset.module)));selectModule(selected);function loadAll(){loaded=0;failed=0;latest=0;$('overview').textContent='Loading your teams…';$('updated').textContent='Checking sources';return Promise.allSettled([loadEspn(),loadGuillotine(),loadPickem()])}$('refresh').onclick=loadAll;loadAll();
</script>
</body>
</html>
