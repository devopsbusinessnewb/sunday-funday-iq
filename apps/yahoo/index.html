<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Sunday Funday IQ · Yahoo</title>
<style>
:root{--bg:#07111f;--panel:#0f1d31;--panel2:#0a1728;--line:#243954;--text:#edf5ff;--muted:#91a7c2;--green:#32d296;--yellow:#f3c969;--red:#ff6b7a;--accent:#a78bfa}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 28px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.titlewrap{min-width:0}
.eyebrow{font-size:9px;letter-spacing:.14em;color:var(--accent);font-weight:900}
h1{font-size:23px;line-height:1.05;margin:3px 0 0}
.subtitle{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topactions{display:flex;gap:7px;flex:0 0 auto}
.iconbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none;font-size:18px;font-weight:900}
.iconbtn.primary{background:var(--accent);color:#170d2b;border:0}
.statusline{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:9px;font-weight:900;border-radius:999px;padding:5px 8px;background:#19304d;color:#cfe6ff}
.chip.green{background:#173d35;color:#9ff0d0}.chip.yellow{background:#473c19;color:#ffe49a}.chip.red{background:#44202a;color:#ffb3be}
.contextline{font-size:10px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.sectiontitle{font-size:15px;font-weight:900;margin:0 0 10px}
.hero{padding:14px 15px}
.matchuphead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.matchuphead .label{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.margin{font-size:26px;font-weight:950;margin-top:2px}
.margin.good{color:var(--green)}.margin.bad{color:var(--yellow)}
.scoreline{margin-top:12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.side{min-width:0}.side.right{text-align:right}.team{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:23px;font-weight:950;margin-top:2px}.proj{font-size:9px;color:var(--muted);margin-top:2px}.vs{font-size:9px;color:var(--muted);font-weight:900}
.summary{font-size:10px;color:var(--muted);margin-top:10px;line-height:1.45}
.alerts{display:grid;gap:7px}
.alert{background:var(--panel2);border:1px solid #203854;border-radius:12px;padding:10px}
.alert strong{display:block;font-size:12px}.alert p{font-size:10px;color:var(--muted);line-height:1.4;margin:4px 0 0}
.alerttag{font-size:8px;font-weight:900;color:var(--yellow);text-transform:uppercase;letter-spacing:.06em}
.players{display:grid;gap:6px}
.player{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid rgba(36,57,84,.76);border-radius:11px;padding:9px 10px}
.slot{font-size:9px;font-weight:900;color:var(--accent)}
.name{font-size:12px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:9px;color:var(--muted);margin-top:2px}
.rightmeta{text-align:right;font-size:10px;white-space:nowrap}
.rightmeta .status{font-size:8px;font-weight:900;margin-top:2px}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}
.available{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.fa{background:var(--panel2);border:1px solid rgba(36,57,84,.76);border-radius:12px;padding:10px}
.fa .name{white-space:normal}.fa .owned{font-size:9px;color:var(--muted);margin-top:4px}.fa .avail{font-size:8px;color:var(--green);font-weight:900;margin-top:5px}
.banner{display:none;margin-bottom:10px;border:1px solid #703042;background:#351923;color:#ffd6dc;border-radius:12px;padding:9px 10px;font-size:10px;line-height:1.4}
.banner.show{display:block}
.empty{text-align:center;color:var(--muted);padding:28px 14px}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
.footer{font-size:8px;color:#667f9d;text-align:center;margin-top:14px}
@media(min-width:700px){.available{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="titlewrap">
      <div class="eyebrow">SUNDAY FUNDAY IQ</div>
      <h1>Yahoo Fantasy</h1>
      <div class="subtitle" id="subtitle">Loading your team…</div>
    </div>
    <div class="topactions">
      <a class="iconbtn" href="../../" aria-label="Home">⌂</a>
      <button class="iconbtn primary" id="refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <div class="statusline">
    <span class="chip" id="freshPill">LOADING</span>
    <span class="contextline" id="contextLine"></span>
  </div>

  <div id="banner" class="banner"></div>
  <div id="empty" class="card empty"><strong>Yahoo data unavailable</strong><span>Waiting for the next snapshot.</span></div>

  <div id="content" style="display:none">
    <section class="card hero">
      <div class="matchuphead">
        <div>
          <div class="label">This week</div>
          <div class="margin" id="margin">—</div>
        </div>
        <div class="contextline" id="marginLabel"></div>
      </div>
      <div class="scoreline">
        <div class="side">
          <div class="team" id="myTeam">Your team</div>
          <div class="score" id="myScore">—</div>
          <div class="proj" id="myProj">Projected —</div>
        </div>
        <div class="vs">VS</div>
        <div class="side right">
          <div class="team" id="oppTeam">Opponent</div>
          <div class="score" id="oppScore">—</div>
          <div class="proj" id="oppProj">Projected —</div>
        </div>
      </div>
      <div class="summary" id="matchupSummary"></div>
    </section>

    <section class="card" id="attentionCard" style="display:none">
      <h2 class="sectiontitle">Needs attention</h2>
      <div class="alerts" id="attention"></div>
    </section>

    <section class="card">
      <h2 class="sectiontitle">Starting lineup</h2>
      <div class="players" id="starters"></div>
    </section>

    <section class="card">
      <h2 class="sectiontitle">Bench</h2>
      <div class="players" id="bench"></div>
    </section>

    <section class="card" id="availableCard">
      <h2 class="sectiontitle">Available now</h2>
      <div class="available" id="available"></div>
    </section>
  </div>

  <div class="footer">Yahoo Build 0.6.0</div>
</main>

<script>
const $=id=>document.getElementById(id);let data=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number.isFinite(+n)?+n:null;
const fmt=n=>num(n)!==null?num(n).toFixed(1):'—';

function freshness(){
  const t=Date.parse(data?.meta?.updatedAt||'');
  const age=Number.isFinite(t)?Math.max(0,(Date.now()-t)/36e5):null;
  const status=age===null?'UNKNOWN':age<=2?'CURRENT':age<=12?'AGING':'STALE';
  return{status,age,text:age===null?'sync unknown':age<1?Math.round(age*60)+'m ago':age.toFixed(1)+'h ago'};
}
function unavailable(p){return /out|injured reserve|\bir\b|doubtful|inactive|suspended/i.test(p?.status||'')||p?.bye===true}
function locked(p){return p?.locked===true||/live|final|completed|in progress/i.test(p?.gameState||'')}
function posEligible(starter,bench){const e=Array.isArray(starter.eligiblePositions)&&starter.eligiblePositions.length?starter.eligiblePositions:[starter.pos];return e.includes(bench.pos)||starter.slot==='FLEX'&&['RB','WR','TE'].includes(bench.pos)||starter.slot==='W/R/T'&&['RB','WR','TE'].includes(bench.pos)}
function bestSwap(starter,bench){
  if(data?.meta?.capabilities?.lockState!==true||data?.meta?.capabilities?.playerProjections!==true)return null;
  if(locked(starter))return null;
  return (bench||[]).filter(b=>!locked(b)&&!unavailable(b)&&posEligible(starter,b)).sort((a,b)=>(num(b.projection)??-999)-(num(a.projection)??-999))[0]||null;
}
function actionable(){
  const out=[],line=data?.lineup||[],bench=data?.bench||[];
  for(const p of line){
    if(!p?.name||p.empty){out.push({title:'Fill '+(p.slot||'empty lineup slot'),detail:'A starting slot is empty.'});continue}
    if(data?.meta?.capabilities?.playerStatus===true&&!locked(p)&&unavailable(p)){
      const b=bestSwap(p,bench);
      out.push({title:'Replace '+p.name,detail:b?b.name+' is the strongest eligible bench option in the current snapshot.':(p.status||'Unavailable')+' starter needs a replacement.'});
      continue;
    }
    if(data?.meta?.capabilities?.playerStatus===true&&!locked(p)&&/questionable|game.?time|limited/i.test(p.status||''))out.push({title:'Monitor '+p.name,detail:(p.status||'Injury designation')+' before kickoff.'});
    const b=bestSwap(p,bench),bp=b?num(b.projection):null,pp=num(p.projection);
    if(b&&bp!==null&&pp!==null&&bp-pp>=2)out.push({title:'Consider '+b.name+' over '+p.name,detail:'Bench option projects '+(bp-pp).toFixed(1)+' higher.'});
  }
  for(const w of (data?.watch||[]))if(w?.title&&!out.some(x=>x.title===w.title))out.push({title:w.title,detail:w.detail||''});
  return out.slice(0,5);
}
function playerCard(p,starter){
  const details=[p.pos,p.nflTeam,p.status].filter(Boolean).join(' · ');
  let right='';
  if(num(p.points)!==null&&num(p.points)!==0)right='<div>'+fmt(p.points)+' pts</div>';
  else if(num(p.projection)!==null&&num(p.projection)!==0)right='<div>'+fmt(p.projection)+' proj</div>';
  let flag='';
  if(starter&&data?.meta?.capabilities?.playerStatus===true){
    if(unavailable(p))flag='<div class="status bad">'+esc(p.status||'UNAVAILABLE')+'</div>';
    else if(/questionable|game.?time|limited/i.test(p.status||''))flag='<div class="status warn">'+esc(p.status)+'</div>';
  }
  return '<div class="player"><div class="slot">'+esc(starter?(p.slot||p.pos):(p.pos||'BN'))+'</div><div><div class="name">'+esc(p.name||'Empty slot')+'</div><div class="meta">'+esc(details||'')+'</div></div><div class="rightmeta">'+right+flag+'</div></div>';
}
function render(){
  if(!data||data?.meta?.status!=='connected'){
    $('empty').style.display='block';$('content').style.display='none';return;
  }
  $('empty').style.display='none';$('content').style.display='block';
  const t=data.team||{},o=data.opponent||{},l=data.league||{},f=freshness(),actions=actionable();
  const m=num(t.projection)!==null&&num(o.projection)!==null?num(t.projection)-num(o.projection):null;

  $('subtitle').textContent=(t.name||'Your team')+' · Week '+(data.meta?.week||'—');
  $('contextLine').textContent=[t.record?('Record '+t.record):null,t.standing?(''+t.standing+(t.standing==1?'st':t.standing==2?'nd':t.standing==3?'rd':'th')):null,num(t.waiverPriority)!==null?('Waiver #'+t.waiverPriority):null,l.teamCount?l.teamCount+' teams':null].filter(Boolean).join(' · ');
  $('freshPill').textContent=f.status+' · '+f.text;
  $('freshPill').className='chip '+(f.status==='CURRENT'?'green':f.status==='AGING'?'yellow':'red');

  $('margin').textContent=m===null?'Projection unavailable':(m>=0?'+':'')+m.toFixed(1);
  $('margin').className='margin '+(m!==null&&m<0?'bad':'good');
  $('marginLabel').textContent=m===null?'':Math.abs(m)<3?'Essentially even':m>0?'Projected margin':'Projected deficit';
  $('myTeam').textContent=t.name||'Your Team';$('oppTeam').textContent=o.name||'Opponent';
  $('myScore').textContent=fmt(t.score);$('oppScore').textContent=fmt(o.score);
  $('myProj').textContent='Projected '+fmt(t.projection);$('oppProj').textContent='Projected '+fmt(o.projection);
  if(m!==null){
    $('matchupSummary').textContent=(o.score>t.score?'Opponent has points on the board, but ':'')+'Yahoo still projects '+(t.name||'your team')+' '+fmt(t.projection)+' to '+fmt(o.projection)+'.';
  }else $('matchupSummary').textContent='Current matchup score shown above.';

  if(actions.length){
    $('attentionCard').style.display='block';
    $('attention').innerHTML=actions.map(a=>'<div class="alert"><div class="alerttag">Action</div><strong>'+esc(a.title)+'</strong><p>'+esc(a.detail)+'</p></div>').join('');
  }else{
    $('attentionCard').style.display='none';
    $('attention').innerHTML='';
  }

  $('starters').innerHTML=(data.lineup||[]).map(p=>playerCard(p,true)).join('');
  $('bench').innerHTML=(data.bench||[]).map(p=>playerCard(p,false)).join('');

  const waivers=(data.waivers||[]).slice(0,8);
  $('availableCard').style.display=waivers.length?'block':'none';
  $('available').innerHTML=waivers.map(p=>'<div class="fa"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc([p.pos,p.nflTeam,p.status].filter(Boolean).join(' · '))+'</div><div class="owned">'+(num(p.percentOwned)!==null?num(p.percentOwned).toFixed(0)+'% Yahoo rostered':'')+'</div><div class="avail">AVAILABLE IN YOUR LEAGUE</div></div>').join('');

  const b=$('banner');
  if(f.status==='STALE'){b.textContent='Data is stale. Refresh before making a time-sensitive move.';b.className='banner show'}
  else b.className='banner';
}
async function load(){
  try{
    const r=await fetch('../../data/live/yahoo.json?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    data=await r.json();render();
  }catch(e){
    data=null;$('content').style.display='none';$('empty').style.display='block';
    const b=$('banner');b.textContent='Could not load Yahoo data.';b.className='banner show';
  }
}
$('refresh').onclick=load;load();
</script>
</body>
</html>
