name: Patch CBS phone refresh timeout

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-cbs-refresh-timeout.py'
      - 'tests/cbs-phone-refresh-regression.js'
      - '.github/workflows/patch-cbs-refresh-timeout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply phone refresh fail-fast patch
        run: python tools/patch-cbs-refresh-timeout.py
      - name: Validate
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text(encoding='utf-8')
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/pickem.js
          node tests/cbs-phone-refresh-regression.js
          node tests/pickem-regression.js
          node tests/pickem-strategy-regression.js
          python tests/cbs-market-parser-regression.py
      - name: Publish patch
        run: |
          if git diff --quiet -- apps/pickem/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pickem/index.html
          git commit -m 'Fail fast when the private CBS bridge is unreachable'
          git push origin main
