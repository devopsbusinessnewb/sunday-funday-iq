name: Patch CBS refresh flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cbs-refresh-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pickem refresh flow
        run: python tools/patch-cbs-refresh-flow.py
      - name: Validate and publish
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text(encoding='utf-8')
          assert "const MODEL_BUILD='1.16.1';" in s
          assert "CBS_AUTOMATION_URL+'/status'" in s
          assert 'Refreshing CBS and market data on the mini-PC' in s
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/pickem.js
          if git diff --quiet -- apps/pickem/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pickem/index.html
          git commit -m 'Wire mini-PC refresh into simulation'
          git push origin main
