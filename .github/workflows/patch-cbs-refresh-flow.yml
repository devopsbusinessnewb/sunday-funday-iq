name: Patch CBS refresh flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cbs-refresh-flow.yml'
      - 'tools/patch-cbs-refresh-flow.py'
      - 'tests/cbs-refresh-handshake.py'
      - 'tests/cbs-phone-refresh-regression.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pickem refresh flow
        run: python tools/patch-cbs-refresh-flow.py
      - name: Validate and publish
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          b=Path('tools/cbs-bridge-server.py').read_text(encoding='utf-8')
          c=Path('tools/cbs-collector.py').read_text(encoding='utf-8')
          assert "const MODEL_BUILD='1.16.9';" in s
          assert "const MODEL_BUILD='1.16.9';" in h
          assert "if(Number(state?.week||1)!==1)return;" in s
          assert 'const structuredFullSlate=' in s
          assert '<summary>View all ${games.length} picks</summary>' in s
          assert 'Current slate mismatch' in s
          assert "baseUrl+'/status'" in s
          assert "baseUrl+'/refresh-sync'" in s
          assert "baseUrl+'/refresh'" in s
          assert "baseUrl+'/live'" in s
          assert 'await importFn(legacy.payload)' in s
          assert 'await importFn(live.payload)' in s
          assert 'def claim_refresh(' in b
          assert "self.path=='/live'" in b
          assert "HEADLESS=os.environ.get('SFIQ_CBS_HEADLESS','1')=='1'" in c
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          Path('/tmp/pickem-home.js').write_text(h.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/pickem.js
          node --check /tmp/pickem-home.js
          python -m py_compile tools/cbs-bridge-server.py tools/cbs-collector.py tests/cbs-refresh-handshake.py
          python tests/cbs-refresh-handshake.py
          node tests/cbs-phone-refresh-regression.js
          node tests/pickem-home-regression.js
          python tests/cbs-market-parser-regression.py
          if git diff --quiet -- index.html apps/pickem/index.html tools/cbs-bridge-server.py tools/cbs-collector.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps/pickem/index.html tools/cbs-bridge-server.py tools/cbs-collector.py
          git commit -m 'Fix dynamic CBS slate handling'
          git push origin main
