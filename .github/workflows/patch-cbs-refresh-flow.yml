name: Patch CBS refresh flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cbs-refresh-flow.yml'
      - 'tools/patch-cbs-refresh-flow.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pickem refresh flow
        run: python tools/patch-cbs-refresh-flow.py
      - name: Validate and publish
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          b=Path('tools/cbs-bridge-server.py').read_text(encoding='utf-8')
          assert "const MODEL_BUILD='1.16.4';" in s
          assert "const MODEL_BUILD='1.16.4';" in h
          assert "current_by_key=" in b
          assert "final_games=" in b
          assert "if game in final_games and game in prev_by_key:" in b
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          Path('/tmp/pickem-home.js').write_text(h.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/pickem.js
          node --check /tmp/pickem-home.js
          python -m py_compile tools/cbs-bridge-server.py tools/cbs-collector.py
          node tests/pickem-regression.js
          node tests/pickem-home-regression.js
          python tests/cbs-market-parser-regression.py
          if git diff --quiet -- index.html apps/pickem/index.html tools/cbs-bridge-server.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps/pickem/index.html tools/cbs-bridge-server.py
          git commit -m 'Handle completed-game odds in CBS refresh'
          git push origin main
