name: Patch CBS refresh flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cbs-refresh-flow.yml'
      - 'tools/patch-cbs-refresh-flow.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pickem refresh flow
        run: python tools/patch-cbs-refresh-flow.py
      - name: Validate and publish
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text(encoding='utf-8')
          h=Path('index.html').read_text(encoding='utf-8')
          assert "const MODEL_BUILD='1.16.3';" in s
          assert "const MODEL_BUILD='1.16.3';" in h
          assert 'raw.githubusercontent.com/devopsbusinessnewb/sunday-funday-iq/main/data/live/cbs-pickem.json' in s
          assert "'/status'" not in s[s.find('async function triggerMiniPcCbsRefresh(){'):s.find('async function loadPublishedCbs(')]
          assert 'baselineStarted' not in s
          assert 'baselineFinished' not in s
          assert 'CBSâ€¦' not in s
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          Path('/tmp/pickem-home.js').write_text(h.split('<script>',1)[1].rsplit('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/pickem.js
          node --check /tmp/pickem-home.js
          node tests/pickem-regression.js
          node tests/pickem-home-regression.js
          node tests/pickem-strategy-regression.js
          python tests/cbs-market-parser-regression.py
          if git diff --quiet -- index.html apps/pickem/index.html tests/pickem-regression.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apps/pickem/index.html tests/pickem-regression.js
          git commit -m 'Advance CBS refresh on new published data'
          git push origin main
