name: Patch CBS refresh flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cbs-refresh-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Pickem refresh flow
        run: python tools/patch-cbs-refresh-flow.py
      - name: Validate and publish
        run: |
          git diff --check
          node tests/pickem-regression.js
          node tests/pickem-home-regression.js
          if git diff --quiet -- apps/pickem/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pickem/index.html
          git commit -m 'Wire mini-PC refresh into simulation'
          git push origin main
