name: Validate Pickem

on:
  push:
    paths:
      - 'index.html'
      - 'apps/pickem/**'
      - 'data/live/cbs-pickem.json'
      - 'data/analysis/cbs-**'
      - 'extensions/cbs-pickem-bridge/**'
      - 'tools/cbs-**'
      - 'tests/**'
      - '.github/workflows/validate-pickem.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'apps/pickem/**'
      - 'data/live/cbs-pickem.json'
      - 'data/analysis/cbs-**'
      - 'extensions/cbs-pickem-bridge/**'
      - 'tools/cbs-**'
      - 'tests/**'
      - '.github/workflows/validate-pickem.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-mnf-tiebreaker-fix:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply MNF tiebreaker fix
        run: python tools/patch-mnf-tiebreaker.py
      - name: Publish fix if needed
        run: |
          if git diff --quiet; then
            echo "MNF tiebreaker fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apps/pickem/index.html
          git commit -m "Fix tiebreaker to use Monday night game"
          git push origin HEAD:main

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch triggering commit
        shell: bash
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check syntax
        shell: bash
        run: |
          cd repo
          python - <<'PY2'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text()
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY2
          node --check /tmp/pickem.js
          python - <<'PY2'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/pickem-home.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY2
          node --check /tmp/pickem-home.js
          node --check tools/cbs-pool-archive.js
          node --check tools/cbs-pool-report.js
          node --check extensions/cbs-pickem-bridge/background.js
          node --check extensions/cbs-pickem-bridge/bridge.js
          node --check extensions/cbs-pickem-bridge/popup.js
          python -m py_compile tools/cbs-bridge-server.py tools/cbs-collector.py tests/cbs-collector-card-regression.py
      - name: Run CBS regression suite
        shell: bash
        run: |
          cd repo
          node tests/pickem-regression.js
          node tests/pickem-home-regression.js
          node tests/pickem-strategy-regression.js
          node tests/cbs-history-regression.js
          node tests/cbs-pool-archive-regression.js
          python tests/cbs-market-parser-regression.py
          python tests/cbs-collector-card-regression.py
          python tests/cbs-current-week-regression.py
          node tests/cbs-phone-refresh-regression.js
          python tests/cbs-refresh-handshake.py
