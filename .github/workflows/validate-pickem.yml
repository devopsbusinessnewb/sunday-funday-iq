name: Validate Pickem

on:
  push:
    paths:
      - 'index.html'
      - 'apps/pickem/**'
      - 'data/live/cbs-pickem.json'
      - 'data/analysis/cbs-**'
      - 'extensions/cbs-pickem-bridge/**'
      - 'tools/cbs-**'
      - 'tests/**'
      - '.github/workflows/validate-pickem.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'apps/pickem/**'
      - 'data/live/cbs-pickem.json'
      - 'data/analysis/cbs-**'
      - 'extensions/cbs-pickem-bridge/**'
      - 'tools/cbs-**'
      - 'tests/**'
      - '.github/workflows/validate-pickem.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-refresh-flow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire mini-PC refresh into Refresh and simulate
        shell: bash
        run: |
          python - <<'PY2'
          from pathlib import Path
          p=Path('apps/pickem/index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace("const MODEL_BUILD='1.16.0';","const MODEL_BUILD='1.16.1';")
          s=s.replace("CBS_AUTOMATION_URL+'/status?v='+Date.now()","CBS_AUTOMATION_URL+'/status'")
          old_block="""  if(routeParams.get('action')==='refresh-simulate'){
    renderRunProgress('cbs','Loading the published CBS card and latest revealed standings…');
    const imported=await loadPublishedCbs({silent:false,onlyIfNewer:false});
    if(!imported){const message='CBS data could not be loaded. The old card was not simulated.';show(message+' Check the published CBS JSON, then try again.','red');renderRunProgress('cbs',message,true);return}
    renderRunProgress('market','CBS data loaded. Verifying current market odds…');
    if(!dataFreshness(state).market.current){const message='Market odds are stale or unavailable. IQ did not simulate with old odds.';show(message,'red');renderRunProgress('market',message,true);return}
    renderRunProgress('simulation','Inputs are current. Building and stress-testing all four cards…');
    await runSimulation();"""
          new_block="""  if(routeParams.get('action')==='refresh-simulate'){
    renderRunProgress('cbs','Refreshing CBS and market data on the mini-PC…');
    try{await triggerMiniPcCbsRefresh()}catch(e){const message='CBS refresh failed: '+e.message;show(message,'red');renderRunProgress('cbs',message,true);return}
    renderRunProgress('market','CBS and market data refreshed. Verifying current inputs…');
    if(!dataFreshness(state).market.current){const message='Fresh market odds were not available after the mini-PC refresh. IQ did not simulate with old odds.';show(message,'red');renderRunProgress('market',message,true);return}
    renderRunProgress('simulation','Inputs are current. Building and stress-testing all four cards…');
    await runSimulation();"""
          if old_block in s:
              s=s.replace(old_block,new_block)
          if s!=old:
              p.write_text(s,encoding='utf-8')
          PY2
          if git diff --quiet -- apps/pickem/index.html; then
            echo 'Refresh flow already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/pickem/index.html
          git commit -m 'Wire mini-PC refresh into simulation'
          git push origin main

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch triggering commit
        shell: bash
        run: |
          git init repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check syntax
        shell: bash
        run: |
          cd repo
          python - <<'PY2'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text()
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY2
          node --check /tmp/pickem.js
          python - <<'PY2'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('/tmp/pickem-home.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY2
          node --check /tmp/pickem-home.js
          node --check tools/cbs-pool-archive.js
          node --check tools/cbs-pool-report.js
          node --check extensions/cbs-pickem-bridge/background.js
          node --check extensions/cbs-pickem-bridge/bridge.js
          node --check extensions/cbs-pickem-bridge/popup.js
          python -m py_compile tools/cbs-bridge-server.py tools/cbs-collector.py
      - name: Run CBS regression suite
        shell: bash
        run: |
          cd repo
          node tests/pickem-regression.js
          node tests/pickem-home-regression.js
          node tests/pickem-strategy-regression.js
          node tests/cbs-history-regression.js
          node tests/cbs-pool-archive-regression.js
          python tests/cbs-market-parser-regression.py
