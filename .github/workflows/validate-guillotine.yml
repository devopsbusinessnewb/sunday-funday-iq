name: Validate Guillotine

on:
  push:
    paths:
      - 'apps/guillotine/**'
      - 'workers/guillotine/**'
      - 'tests/guillotine-*.js'
      - '.github/workflows/validate-guillotine.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guillotine core regression
        run: node tests/guillotine-regression.js
      - name: Guillotine roster engine regression
        run: node tests/guillotine-roster-engine.js
      - name: Guillotine FAAB market regression
        run: node tests/guillotine-market-engine.js
      - name: Production smoke test
        run: node tests/guillotine-smoke.js
      - name: Worker syntax check
        run: python -m py_compile workers/guillotine/collector.py
