name: Validate Guillotine

on:
  push:
    paths:
      - 'apps/guillotine/**'
      - 'tests/guillotine-*.js'
      - '.github/workflows/validate-guillotine.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guillotine core regression
        run: node tests/guillotine-regression.js
      - name: Production smoke test
        run: node tests/guillotine-smoke.js
