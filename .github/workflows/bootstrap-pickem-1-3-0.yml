name: Bootstrap Pickem 1.3.0

on:
  push:
    paths:
      - '.github/workflows/bootstrap-pickem-1-3-0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Build, test, and commit Pickem 1.3.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: sfiq/pickem-1-3-0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BRANCH" "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" repo
          cd repo
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('apps/pickem/index.html')
          src=p.read_text()
          start=src.index('const EMBEDDED_CBS_SCAN=')
          end=src.index('\n\nconst SEARCH_ITERS',start)
          raw=src[start+len('const EMBEDDED_CBS_SCAN='):end].strip()
          if raw.endswith(';'): raw=raw[:-1]
          scan=json.loads(raw)

          Path('data/live').mkdir(parents=True,exist_ok=True)
          Path('data/live/cbs-pickem.json').write_text(json.dumps(scan,indent=2)+'\n')

          s=src[:start]+"const LIVE_CBS_URL='../../data/live/cbs-pickem.json';\n"+src[end+2:]
          s=s.replace('Build 1.2.0 · clearer KEEP recommendations','Build 1.3.0 · live CBS data separated + regression protected')

          anchor='async function boot(){\n'
          loader="""async function loadPublishedCbs({silent=true,onlyIfNewer=true}={}){\n  try{\n    const r=await fetch(LIVE_CBS_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);\n    const obj=await r.json();const incoming=Date.parse(obj?.exportedAt||''),stored=Date.parse(state.importedAt||state.cbsUpdatedAt||'');\n    if(onlyIfNewer&&Number.isFinite(stored)&&Number.isFinite(incoming)&&incoming<=stored)return false;\n    await importScan(obj);if(!silent)show('CBS refreshed from the published live data file.');return true;\n  }catch(err){console.error('Published CBS data load failed',err);if(!silent)show('No newer published CBS data was available. Choose a bridge JSON file instead.','yellow');return false}\n}\n"""
          if anchor not in s: raise SystemExit('boot anchor missing')
          s=s.replace(anchor,loader+anchor,1)

          old="  $('refreshBtn').onclick=()=>$('scanFile').click();$('scanFile').onchange=async e=>{try{const f=e.target.files?.[0];if(f)await importScan(JSON.parse(await f.text()))}catch(err){show('Could not refresh CBS data: '+err.message,'red')}e.target.value=''};"
          new="  $('refreshBtn').onclick=async()=>{const got=await loadPublishedCbs({silent:false,onlyIfNewer:true});if(!got)$('scanFile').click()};$('scanFile').onchange=async e=>{try{const f=e.target.files?.[0];if(f)await importScan(JSON.parse(await f.text()))}catch(err){show('Could not refresh CBS data: '+err.message,'red')}e.target.value=''};"
          if old not in s: raise SystemExit('refresh handler missing')
          s=s.replace(old,new,1)

          oldboot="""  render();\n  try{\n    const embeddedTs=Date.parse(EMBEDDED_CBS_SCAN?.exportedAt||'');\n    const storedTs=Date.parse(state.importedAt||'');\n    if(Number.isFinite(embeddedTs)&&(!Number.isFinite(storedTs)||embeddedTs>storedTs)){\n      await importScan(EMBEDDED_CBS_SCAN);\n      show('CBS snapshot bundled with Build 1.1.9 loaded automatically.');\n    }\n  }catch(err){console.error('Embedded CBS snapshot load failed',err);show('Bundled CBS snapshot could not load: '+err.message,'red')}\n"""
          if oldboot not in s: raise SystemExit('embedded boot block missing')
          s=s.replace(oldboot,"  render();\n  await loadPublishedCbs({silent:true,onlyIfNewer:true});\n",1)

          oldexp='globalThis.SFIQ_TEST={validConfidence,ensureValidCard,dataFreshness,buildWorlds,evaluateCard,optimizeConfidence,runOptimizer,cardActions,marketProb,ownProb,clone,refreshResults,isLocked,fixedWinner};'
          newexp='globalThis.SFIQ_TEST={validConfidence,ensureValidCard,dataFreshness,buildWorlds,evaluateCard,optimizeConfidence,runOptimizer,cardActions,marketProb,ownProb,clone,refreshResults,isLocked,fixedWinner,parsePicks,extractStructuredCard,extractFieldModel,SEED,normalizeTeam};'
          if oldexp not in s: raise SystemExit('test export block missing')
          s=s.replace(oldexp,newexp,1)
          p.write_text(s)

          Path('tests/fixtures').mkdir(parents=True,exist_ok=True)
          Path('tests/fixtures/cbs-postgame.json').write_text(json.dumps(scan,indent=2)+'\n')

          header=[('NE','SEA'),('SF','LAR'),('TB','CIN'),('BUF','HOU'),('BAL','IND'),('CHI','CAR'),('NO','DET'),('CLE','JAC'),('ATL','PIT'),('NYJ','TEN'),('GB','MIN'),('WAS','PHI'),('MIA','LV'),('ARI','LAC'),('DAL','NYG'),('DEN','KC')]
          picks=['SEA','LAR','CIN','BUF','BAL','CAR','DET','JAX','PIT','TEN','GB','PHI','LV','LAC','DAL','KC']
          weights=[1,15,14,13,11,10,16,9,7,6,5,12,3,8,4,2]
          ht='\n'.join(f'SUN 12:00 PM\n{a}\n{h}' for a,h in header)
          row='Tony Eickhoff\n\t0\t0\t\n'+'\n\t\n'.join(f'{team}\n({w})' for team,w in zip(picks,weights))
          pre={'product':"CBS Pick'em IQ Bridge",'version':'regression-pregame','exportedAt':'2026-09-09T00:05:26.669Z','snapshots':[{'title':'NFL Football Tourney 2026 | Weekly Standings','url':'https://picks.cbssports.com/football/pickem/pools/test/standings/weekly','ts':'2026-09-09T00:05:18.446Z','text':ht+'\n\n'+row}]}
          Path('tests/fixtures/cbs-pregame.json').write_text(json.dumps(pre,indent=2)+'\n')

          test=r'''const fs=require('fs');
          const vm=require('vm');
          const path=require('path');
          const root=path.resolve(__dirname,'..');
          const html=fs.readFileSync(path.join(root,'apps/pickem/index.html'),'utf8');
          if(!html.includes('Build 1.3.0')) throw new Error('Expected Pickem Build 1.3.0');
          if(html.includes('EMBEDDED_CBS_SCAN')) throw new Error('CBS live scan must not be embedded in app code');
          if(!html.includes("LIVE_CBS_URL='../../data/live/cbs-pickem.json'")) throw new Error('Live CBS data URL missing');
          const js=html.split('<script>',2)[1].split('</script>',1)[0];
          const ctx={console,globalThis:null,setTimeout,clearTimeout,fetch:async()=>({ok:false})};ctx.globalThis=ctx;ctx.__SFIQ_TESTING__=true;
          vm.createContext(ctx);vm.runInContext(js,ctx,{filename:'pickem-index.js'});
          const t=ctx.SFIQ_TEST,clone=x=>JSON.parse(JSON.stringify(x));
          const pre=JSON.parse(fs.readFileSync(path.join(root,'tests/fixtures/cbs-pregame.json'),'utf8'));
          const post=JSON.parse(fs.readFileSync(path.join(root,'tests/fixtures/cbs-postgame.json'),'utf8'));
          const expectedPre={picks:['SEA','LAR','CIN','BUF','BAL','CAR','DET','JAX','PIT','TEN','GB','PHI','LV','LAC','DAL','KC'],weights:[1,15,14,13,11,10,16,9,7,6,5,12,3,8,4,2]};
          const expectedPost={picks:['SEA','SF','CIN','HOU','BAL','CHI','DET','JAX','PIT','NYJ','GB','PHI','LV','LAC','DAL','KC'],weights:[9,1,13,7,14,8,16,12,11,2,6,15,4,10,5,3]};
          function assertCard(label,actual,expected){if(actual.pickCount!==16||actual.weightCount!==16)throw new Error(`${label}: ${actual.pickCount}/${actual.weightCount}`);if(JSON.stringify(actual.picks)!==JSON.stringify(expected.picks))throw new Error(`${label}: picks mismatch`);if(JSON.stringify(actual.weights)!==JSON.stringify(expected.weights))throw new Error(`${label}: confidence mismatch`);if(new Set(actual.weights).size!==16)throw new Error(`${label}: confidence not unique`)}
          assertCard('pregame',t.extractStructuredCard(pre,clone(t.SEED)),expectedPre);
          const postGames=clone(t.SEED);for(const g of postGames){if(g.away==='NE'&&g.home==='SEA')Object.assign(g,{pick:'SEA',weight:9,locked:true,completed:true,winner:1,statusText:'Final 10-13'});if(g.away==='SF'&&g.home==='LAR')Object.assign(g,{pick:'SF',weight:1,locked:true,completed:true,winner:0,statusText:'Final 27-7'})}
          assertCard('postgame',t.extractStructuredCard(post,postGames),expectedPost);
          const fm=t.extractFieldModel(post,postGames);if(!fm||fm.observedEntries!==92)throw new Error(`field model expected 92, got ${fm?.observedEntries}`);
          const live=JSON.parse(fs.readFileSync(path.join(root,'data/live/cbs-pickem.json'),'utf8'));assertCard('published live CBS',t.extractStructuredCard(live,postGames),expectedPost);
          console.log('Pickem regression suite passed: pregame 16/16, postgame 16/16, published live 16/16, field model 92.');
          '''
          Path('tests/pickem-regression.js').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())+'\n')

          validation="""name: Validate Pickem\n\non:\n  push:\n    paths:\n      - 'apps/pickem/**'\n      - 'data/live/cbs-pickem.json'\n      - 'tests/**'\n      - '.github/workflows/validate-pickem.yml'\n  pull_request:\n    paths:\n      - 'apps/pickem/**'\n      - 'data/live/cbs-pickem.json'\n      - 'tests/**'\n      - '.github/workflows/validate-pickem.yml'\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  regression:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Fetch repository\n        shell: bash\n        run: git clone --depth 1 \"https://github.com/${GITHUB_REPOSITORY}.git\" repo\n      - name: Check JavaScript syntax\n        shell: bash\n        run: |\n          cd repo\n          python - <<'PY2'\n          from pathlib import Path\n          s=Path('apps/pickem/index.html').read_text()\n          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])\n          PY2\n          node --check /tmp/pickem.js\n      - name: Run CBS regression suite\n        shell: bash\n        run: cd repo && node tests/pickem-regression.js\n"""
          Path('.github/workflows').mkdir(parents=True,exist_ok=True)
          Path('.github/workflows/validate-pickem.yml').write_text(validation)

          Path('docs').mkdir(exist_ok=True)
          Path('docs/DEPLOYMENT.md').write_text("""# Sunday Funday IQ deployment workflow\n\n## Source of truth\nGitHub `main` is the production source of truth. Chat files and Library copies are reference artifacts only.\n\n## Code changes\nSmall low-risk UI fixes may go directly to `main` after local validation. Parser, optimizer, data-model, and multi-file changes should use a branch/PR when practical, with regression validation before merge.\n\n## Regression protection\n`.github/workflows/validate-pickem.yml` checks JavaScript syntax and runs `tests/pickem-regression.js` whenever Pick'em code, CBS live data, or regression fixtures change. The suite verifies pregame and postgame CBS card reconstruction, unique 1-16 confidence values, and the revealed-field model.\n\n## Data vs. code\nCBS live state is published separately at `data/live/cbs-pickem.json`. A CBS refresh should update that data file without requiring a new application build. `apps/pickem/index.html` loads published CBS data on startup when it is newer than browser state. Manual bridge JSON import remains a fallback.\n""")
          PY

          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text()
          Path('/tmp/pickem.js').write_text(s.split('<script>',1)[1].rsplit('</script>',1)[0])
          PY
          node --check /tmp/pickem.js
          node tests/pickem-regression.js

          rm -f .github/workflows/bootstrap-pickem-1-3-0.yml
          git config user.name 'Sunday Funday IQ Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/pickem/index.html data/live/cbs-pickem.json tests .github/workflows/validate-pickem.yml docs/DEPLOYMENT.md .github/workflows/bootstrap-pickem-1-3-0.yml
          git commit -m '1.3.0 Separate CBS live data and add regression tests'
          git push origin "$BRANCH"
