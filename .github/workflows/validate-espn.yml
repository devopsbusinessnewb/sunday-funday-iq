name: Validate ESPN

on:
  push:
    paths:
      - 'apps/espn/**'
      - 'tools/espn-sync.py'
      - 'data/examples/espn-snapshot.example.json'
      - 'docs/ESPN.md'
      - '.github/workflows/validate-espn.yml'
  pull_request:
    paths:
      - 'apps/espn/**'
      - 'tools/espn-sync.py'
      - 'data/examples/espn-snapshot.example.json'
      - 'docs/ESPN.md'
      - '.github/workflows/validate-espn.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
      - name: Check ESPN front-end JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/espn/index.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/espn.js').write_text(js)
          assert 'Build 0.2.0' in s
          assert 'function decisions()' in s
          assert 'function bestSwap' in s
          assert 'ESPN_SWID' not in s and 'ESPN_S2' not in s
          PY
          node --check /tmp/espn.js
      - name: Check private collector syntax and contract
        shell: bash
        run: |
          python -m py_compile tools/espn-sync.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/examples/espn-snapshot.example.json').read_text())
          assert d['meta']['status']=='connected'
          assert isinstance(d['lineup'],list) and isinstance(d['bench'],list)
          assert 'espn_s2' not in Path('data/examples/espn-snapshot.example.json').read_text().lower()
          c=Path('tools/espn-sync.py').read_text()
          assert "pos_names={1:'QB',2:'RB',3:'WR',4:'TE',5:'K',16:'D/ST'}" in c
          PY
