name: Validate ESPN

on:
  push:
    paths:
      - 'apps/espn/**'
      - 'extensions/espn-fantasy-bridge/**'
      - 'tools/espn-sync.py'
      - 'tools/espn-bridge-server.py'
      - 'Start ESPN IQ Sync.cmd'
      - 'data/examples/espn-snapshot.example.json'
      - 'docs/ESPN.md'
      - '.github/workflows/validate-espn.yml'
  pull_request:
    paths:
      - 'apps/espn/**'
      - 'extensions/espn-fantasy-bridge/**'
      - 'tools/espn-sync.py'
      - 'tools/espn-bridge-server.py'
      - 'Start ESPN IQ Sync.cmd'
      - 'data/examples/espn-snapshot.example.json'
      - 'docs/ESPN.md'
      - '.github/workflows/validate-espn.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
      - name: Check ESPN front-end JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/espn/index.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/espn.js').write_text(js)
          assert 'Build 0.2.0' in s
          assert 'function decisions()' in s
          assert 'function bestSwap' in s
          assert 'ESPN_SWID' not in s and 'ESPN_S2' not in s
          PY
          node --check /tmp/espn.js
      - name: Check ESPN browser bridge
        shell: bash
        run: |
          node --check extensions/espn-fantasy-bridge/popup.js
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('extensions/espn-fantasy-bridge/manifest.json').read_text())
          assert manifest['manifest_version']==3
          assert manifest['version']=='0.4.0'
          assert 'scripting' in manifest['permissions']
          assert 'https://fantasy.espn.com/*' in manifest['host_permissions']
          js=Path('extensions/espn-fantasy-bridge/popup.js').read_text().lower()
          assert "credentials:'include'" in js
          assert 'chrome.scripting.executescript' in js
          assert 'document.cookie' not in js
          assert 'chrome.cookies' not in js
          PY
      - name: Check private collectors and automatic local sync
        shell: bash
        run: |
          python -m py_compile tools/espn-sync.py tools/espn-bridge-server.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/examples/espn-snapshot.example.json').read_text())
          assert d['meta']['status']=='connected'
          assert isinstance(d['lineup'],list) and isinstance(d['bench'],list)
          assert 'espn_s2' not in Path('data/examples/espn-snapshot.example.json').read_text().lower()
          c=Path('tools/espn-sync.py').read_text()
          assert "pos_names={1:'QB',2:'RB',3:'WR',4:'TE',5:'K',16:'D/ST'}" in c
          server=Path('tools/espn-bridge-server.py').read_text().lower()
          assert "('127.0.0.1',43127)" in server
          assert "forbidden = ('espn_s2','swid','cookie','authorization')" in server
          assert "run_git('push','origin','main'" in server
          assert "run_git('pull','--rebase','--autostash','origin','main'" in server
          launcher=Path('Start ESPN IQ Sync.cmd').read_text()
          assert 'set SFIQ_AUTO_PUSH=1' in launcher
          assert 'python tools\\espn-bridge-server.py' in launcher
          PY
