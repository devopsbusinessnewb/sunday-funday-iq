name: CBS worker lifecycle
on:
  pull_request:
    paths:
      - 'tools/cbs-worker-runtime.py'
      - 'tools/cbs-collector.py'
      - 'tools/cbs-bridge-server.py'
      - 'tests/test_cbs_worker_runtime.py'
      - '.github/workflows/cbs-worker-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_cbs_worker_runtime.py -v
      - run: python -m py_compile tools/cbs-worker-runtime.py tools/cbs-collector.py tools/cbs-bridge-server.py
