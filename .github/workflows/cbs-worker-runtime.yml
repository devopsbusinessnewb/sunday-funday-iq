name: CBS worker lifecycle
on:
  pull_request:
    paths:
      - 'tools/cbs-worker-runtime.py'
      - 'tools/cbs-collector.py'
      - 'tools/cbs-bridge-server.py'
      - 'tools/sfiq-auto-update.ps1'
      - 'tools/install-cbs-reliability.ps1'
      - 'tools/test-cbs-reboot-readiness.ps1'
      - 'tools/cbs-task-definition.ps1'
      - 'tools/enable-cbs-unattended.ps1'
      - 'tools/restore-cbs-task-backup.ps1'
      - 'tools/enable-sfiq-auto-update.ps1'
      - 'tools/enable-cbs-production.ps1'
      - 'tools/cbs-setup-diagnostics.ps1'
      - 'tests/windows/**'
      - 'tests/test_cbs_worker_runtime.py'
      - '.github/workflows/cbs-worker-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_cbs_worker_runtime.py -v
      - run: python -m py_compile tools/cbs-worker-runtime.py tools/cbs-collector.py tools/cbs-bridge-server.py
      - name: Validate PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('tools/sfiq-auto-update.ps1','tools/install-cbs-reliability.ps1','tools/test-cbs-reboot-readiness.ps1','tools/cbs-task-definition.ps1','tools/enable-cbs-unattended.ps1','tools/restore-cbs-task-backup.ps1','tools/enable-sfiq-auto-update.ps1','tools/enable-cbs-production.ps1','tests/windows/test-cbs-task-definition.ps1','tests/windows/test-cbs-installer-guards.ps1','tools/cbs-setup-diagnostics.ps1','tests/windows/test-cbs-setup-diagnostics.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Validate native Windows task conversion
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test-cbs-task-definition.ps1
      - name: Verify unattended installer guards
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test-cbs-installer-guards.ps1
      - name: Verify sanitized setup diagnostics
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows/test-cbs-setup-diagnostics.ps1
