name: Deploy Pickem 1.2.0

on:
  push:
    paths:
      - '.github/workflows/pickem-1-2-0.yml'

permissions:
  contents: write

jobs:
  patch-pickem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Pickem KEEP recommendations
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/pickem/index.html')
          s = p.read_text()
          s = s.replace('Build 1.1.9 · embedded postgame CBS snapshot', 'Build 1.2.0 · clearer KEEP recommendations')
          old = """  const keeps=interestingKeeps(state.games,o.current,o.recommended);for(const k of keeps){const g=state.games[k.i],s=o.current.choices[k.i];html+=`<div class=\"rec\"><div class=\"rec-head\"><div><div class=\"rec-title\">KEEP</div><div class=\"rec-action\">${teamFor(g,s)} · ${o.current.weights[k.i]} confidence</div></div><span class=\"pill blue\">KEEP</span></div><div class=\"reason\">Keep the pick on ${teamFor(g,s)}. The market-vs-pool difference is ${pp(k.e,0)}, but IQ did not improve the final card by changing the winner. If IQ changes this team’s confidence, that separate confidence instruction appears above.</div></div>`}
"""
          new = """  const keeps=interestingKeeps(state.games,o.current,o.recommended);for(const k of keeps){const g=state.games[k.i],s=o.current.choices[k.i],team=teamFor(g,s),curConf=o.current.weights[k.i],recConf=o.recommended.weights[k.i],confChanged=curConf!==recConf;html+=`<div class=\"rec\"><div class=\"rec-head\"><div><div class=\"rec-title\">KEEP PICK</div><div class=\"rec-action\">${team}</div><div class=\"change-sub\">${confChanged?`Confidence: ${curConf} → ${recConf}`:`Confidence stays ${curConf}`}</div></div><span class=\"pill blue\">KEEP</span></div><div class=\"reason\">Keep the winner on ${team}. The market-vs-pool difference is ${pp(k.e,0)}, but IQ did not improve the final card by changing the pick.${confChanged?` IQ does recommend changing ${team} confidence from ${curConf} to ${recConf}; that same confidence change is listed above and ${recConf} is the final IQ value.`:` IQ also keeps ${team} at confidence ${curConf}.`}</div></div>`}
"""
          if old not in s:
              raise SystemExit('Expected KEEP block not found; refusing to patch production')
          s = s.replace(old, new)
          p.write_text(s)
      - name: Verify JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/pickem/index.html').read_text()
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/pickem.js').write_text(js)
          PY
          node --check /tmp/pickem.js
      - name: Commit production update
        shell: bash
        run: |
          git config user.name 'Sunday Funday IQ Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/pickem/index.html
          git diff --cached --quiet && exit 0
          git commit -m '1.2.0 Clarify KEEP confidence recommendations'
          git push origin main
