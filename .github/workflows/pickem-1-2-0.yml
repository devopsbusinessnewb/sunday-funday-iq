name: Deploy Pickem 1.2.0

on:
  push:
    paths:
      - '.github/workflows/pickem-1-2-0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pickem:
    runs-on: ubuntu-latest
    steps:
      - name: Patch Pickem directly through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO/contents/apps/pickem/index.html"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$api" > /tmp/file.json
          python - <<'PY'
          import json, base64
          from pathlib import Path
          d=json.loads(Path('/tmp/file.json').read_text())
          s=base64.b64decode(d['content']).decode()
          s=s.replace('Build 1.1.9 · embedded postgame CBS snapshot','Build 1.2.0 · clearer KEEP recommendations')
          old='''  const keeps=interestingKeeps(state.games,o.current,o.recommended);for(const k of keeps){const g=state.games[k.i],s=o.current.choices[k.i];html+=`<div class="rec"><div class="rec-head"><div><div class="rec-title">KEEP</div><div class="rec-action">${teamFor(g,s)} · ${o.current.weights[k.i]} confidence</div></div><span class="pill blue">KEEP</span></div><div class="reason">Keep the pick on ${teamFor(g,s)}. The market-vs-pool difference is ${pp(k.e,0)}, but IQ did not improve the final card by changing the winner. If IQ changes this team’s confidence, that separate confidence instruction appears above.</div></div>`}\n'''
          new='''  const keeps=interestingKeeps(state.games,o.current,o.recommended);for(const k of keeps){const g=state.games[k.i],s=o.current.choices[k.i],team=teamFor(g,s),curConf=o.current.weights[k.i],recConf=o.recommended.weights[k.i],confChanged=curConf!==recConf;html+=`<div class="rec"><div class="rec-head"><div><div class="rec-title">KEEP PICK</div><div class="rec-action">${team}</div><div class="change-sub">${confChanged?`Confidence: ${curConf} → ${recConf}`:`Confidence stays ${curConf}`}</div></div><span class="pill blue">KEEP</span></div><div class="reason">Keep the winner on ${team}. The market-vs-pool difference is ${pp(k.e,0)}, but IQ did not improve the final card by changing the pick.${confChanged?` IQ does recommend changing ${team} confidence from ${curConf} to ${recConf}; that same confidence change is listed above and ${recConf} is the final IQ value.`:` IQ also keeps ${team} at confidence ${curConf}.`}</div></div>`}\n'''
          if old not in s:
              raise SystemExit('Expected KEEP block not found; refusing to patch production')
          s=s.replace(old,new)
          Path('/tmp/index.html').write_text(s)
          Path('/tmp/sha.txt').write_text(d['sha'])
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/pickem.js').write_text(js)
          PY
          node --check /tmp/pickem.js
          python - <<'PY'
          import json, base64
          from pathlib import Path
          payload={
            'message':'1.2.0 Clarify KEEP confidence recommendations',
            'content':base64.b64encode(Path('/tmp/index.html').read_bytes()).decode(),
            'sha':Path('/tmp/sha.txt').read_text().strip(),
            'branch':'main'
          }
          Path('/tmp/payload.json').write_text(json.dumps(payload))
          PY
          curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @/tmp/payload.json "$api"
