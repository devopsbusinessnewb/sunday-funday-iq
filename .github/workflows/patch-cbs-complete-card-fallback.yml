name: Patch CBS complete-card fallback

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-cbs-complete-card-fallback.py'
      - '.github/workflows/patch-cbs-complete-card-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply complete-card fallback
        run: python tools/patch-cbs-complete-card-fallback.py
      - name: Validate
        run: |
          git diff --check
          python -m py_compile tools/cbs-bridge-server.py tools/cbs-collector.py
          python tests/cbs-card-fallback-regression.py
          python tests/cbs-market-parser-regression.py
          python tests/cbs-refresh-handshake.py
          node tests/cbs-phone-refresh-regression.js
          node tests/pickem-regression.js
      - name: Publish patch
        run: |
          if git diff --quiet -- tools/cbs-bridge-server.py tests/cbs-card-fallback-regression.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/cbs-bridge-server.py tests/cbs-card-fallback-regression.py
          git commit -m 'Keep CBS refresh usable when submitted card row is unavailable'
          git push origin main
